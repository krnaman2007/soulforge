<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary Metadata -->
    <title>Soulforge — Gamify Your Life &amp; Master Your Destiny</title>
    <meta name="title" content="Soulforge — Gamify Your Life &amp; Master Your Destiny" />
    <meta
      name="description"
      content="Transform your habits, projects, and daily tasks into an authoritative cyberpunk RPG. Gain XP, climb the leaderboard, redeem real rewards, and forge your legend."

    <meta name="author" content="Soulforge Team" />
    <meta name="robots" content="index, follow" />

    <!-- Browser Theme & Color Scheme -->
    <meta name="theme-color" content="#0a0a12" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Soulforge" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Font Preconnect & Loading Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700;800&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://soulforge-chi.vercel.app/" />
    <meta property="og:title" content="Soulforge — Gamify Your Life &amp; Master Your Destiny" />
    <meta
      property="og:description"
      content="Transform your habits, projects, and daily tasks into an authoritative cyberpunk RPG. Gain XP, climb the leaderboard, redeem real rewards, and forge your legend."
    />
    <meta property="og:site_name" content="Soulforge" />

    <meta name="twitter:title" content="Soulforge — Gamify Your Life &amp; Master Your Destiny" />
    <meta
      name="twitter:description"
      content="Transform your habits, projects, and daily tasks into an authoritative cyberpunk RPG. Gain XP, climb the leaderboard, redeem real rewards, and forge your legend."
    />
  </head>
  <body class="bg-[#0a0a12] text-[#e8e8f0] selection:bg-[#00f0ff] selection:text-[#0a0a12] antialiased">

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
