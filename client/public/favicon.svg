<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141422" />
      <stop offset="100%" stop-color="#07070d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Hexagonal Outer Shield -->
  <polygon points="32,3 59,17.5 59,46.5 32,61 5,46.5 5,17.5" fill="url(#dark-bg)" stroke="url(#cyber-grad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Inner Cybernetic Facet -->
  <polygon points="32,9 53,21 53,43 32,55 11,43 11,21" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.2" />

  <!-- Central Forge Monogram / Crest -->
  <path d="M22 23 C22 18 42 16 42 24 C42 30 22 32 22 40 C22 48 42 46 42 41" fill="none" stroke="url(#cyber-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Cyber Spark Accents -->
  <circle cx="32" cy="14" r="2" fill="#00f0ff" />
  <circle cx="32" cy="50" r="2" fill="#ec4899" />
</svg>
